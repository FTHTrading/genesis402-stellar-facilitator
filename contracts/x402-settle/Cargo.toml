[package]
name = "x402-settle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "x402 settlement contract for Stellar: payer-authorized, nonce-guarded transfer of exactly the quoted amount of a token from payer to seller, with a readable settlement record. No fee logic. Admin-less, immutable v1."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
